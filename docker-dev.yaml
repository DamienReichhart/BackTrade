services:
    dev:
        build:
            context: .
            dockerfile: ./docker/images/dev.dockerfile
        env_file:
            - .env
        ports:
            - "21799:21799"
            - "5173:5173"
        volumes:
            - ./apps:/app/apps
            - ./packages:/app/packages
            - ./assets:/app/assets
            - ./docker/config/minio/certs:/app/docker/config/minio/certs:ro
            # Exclude node_modules from volume mounts to preserve installed dependencies
            - /app/node_modules
            - /app/apps/api/node_modules
            - /app/apps/worker/node_modules
            - /app/apps/web/node_modules
            - /app/packages/datas/node_modules
            - /app/packages/eslint-config/node_modules
            - /app/packages/tsconfig/node_modules
            - /app/packages/types/node_modules
            - /app/packages/utils/node_modules
        networks:
            backtrade:
                ipv4_address: 192.168.250.11
        restart: always

    postgres:
        build:
            context: .
            dockerfile: ./docker/images/postgres.dockerfile
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - backtrade_db:/var/lib/postgresql/data
        networks:
            backtrade:
                ipv4_address: 192.168.250.21
        restart: always

    redis:
        build:
            context: .
            dockerfile: ./docker/images/redis.dockerfile
        ports:
            - "6379:6379"
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        networks:
            backtrade:
                ipv4_address: 192.168.250.22
        restart: always

    minio:
        build:
            context: .
            dockerfile: ./docker/images/minio.dockerfile
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - backtrade_minio_data:/data
            - ./docker/config/minio/certs:/root/.minio/certs:ro
        networks:
            backtrade:
                ipv4_address: 192.168.250.23
        restart: always

    rabbitmq:
        build:
            context: .
            dockerfile: ./docker/images/rabbitmq.dockerfile
        ports:
            - "15672:15672"
            - "5672:5672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        networks:
            backtrade:
                ipv4_address: 192.168.250.31
        restart: always

volumes:
    backtrade_db:
        driver: local
    backtrade_minio_data:
        driver: local

networks:
    backtrade:
        driver: bridge
        ipam:
            config:
                - subnet: 192.168.250.0/24
                  gateway: 192.168.250.254
