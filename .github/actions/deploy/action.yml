name: Deploy via SCP and SSH
description: Copies repo files to a remote host and rebuilds the docker containers
inputs:
    ssh_host:
        description: SSH host (hostname or IP)
        required: true
    ssh_port:
        description: SSH port
        required: true
        default: "22"
    ssh_user:
        description: SSH username
        required: true
    ssh_key:
        description: Private SSH key for authentication
        required: true
    remote_dir:
        description: Remote directory to copy files into
        required: true
    database_url:
        description: Database URL for Prisma client generation during build
        required: true
runs:
    using: composite
    steps:
        - name: Validate inputs
          shell: bash
          run: |
              echo "Validating deployment inputs..."
              echo "ssh_host is set: $([ -n "${{ inputs.ssh_host }}" ] && echo 'yes' || echo 'no')"
              echo "ssh_user is set: $([ -n "${{ inputs.ssh_user }}" ] && echo 'yes' || echo 'no')"
              echo "ssh_port is set: $([ -n "${{ inputs.ssh_port }}" ] && echo 'yes' || echo 'no')"
              echo "ssh_key is set: $([ -n "${{ inputs.ssh_key }}" ] && echo 'yes' || echo 'no')"
              echo "remote_dir is set: $([ -n "${{ inputs.remote_dir }}" ] && echo 'yes' || echo 'no')"
              echo "database_url is set: $([ -n "${{ inputs.database_url }}" ] && echo 'yes' || echo 'no')"

              if [ -z "${{ inputs.ssh_host }}" ] || \
                 [ -z "${{ inputs.ssh_user }}" ] || \
                 [ -z "${{ inputs.ssh_port }}" ] || \
                 [ -z "${{ inputs.ssh_key }}" ] || \
                 [ -z "${{ inputs.remote_dir }}" ] || \
                 [ -z "${{ inputs.database_url }}" ]; then
                  echo "Error: One or more required inputs are missing"
                  exit 1
              fi
              echo "All inputs validated successfully"

        - name: Setup SSH key
          shell: bash
          run: |
              set -e
              mkdir -p ~/.ssh

              # Validate required inputs
              if [ -z "${{ inputs.ssh_host }}" ]; then
                  echo "Error: ssh_host is empty or not set"
                  exit 1
              fi
              if [ -z "${{ inputs.ssh_user }}" ]; then
                  echo "Error: ssh_user is empty or not set"
                  exit 1
              fi
              if [ -z "${{ inputs.ssh_port }}" ]; then
                  echo "Error: ssh_port is empty or not set"
                  exit 1
              fi
              if [ -z "${{ inputs.ssh_key }}" ]; then
                  echo "Error: ssh_key is empty or not set"
                  exit 1
              fi

              # Write SSH key
              echo "${{ inputs.ssh_key }}" > ~/.ssh/id_deploy
              chmod 600 ~/.ssh/id_deploy

              # Create SSH config with proper escaping
              {
                  echo "Host remote"
                  echo "  HostName ${{ inputs.ssh_host }}"
                  echo "  User ${{ inputs.ssh_user }}"
                  echo "  Port ${{ inputs.ssh_port }}"
                  echo "  IdentityFile ~/.ssh/id_deploy"
                  echo "  StrictHostKeyChecking no"
              } >> ~/.ssh/config

              # Verify SSH config is valid
              if ! ssh -F ~/.ssh/config -G remote > /dev/null 2>&1; then
                  echo "Error: Generated SSH config is invalid"
                  echo "SSH config contents:"
                  cat ~/.ssh/config
                  exit 1
              fi

        - name: Create backup directory and backup .env
          shell: bash
          run: |
              echo "Creating backup directory and backing up .env file..."
              ssh remote "
                mkdir -p '${{ inputs.remote_dir }}' && \
                mkdir -p /tmp/backtrade_deploy_backup && \
                if [ -f '${{ inputs.remote_dir }}/.env' ]; then
                  cp '${{ inputs.remote_dir }}/.env' /tmp/backtrade_deploy_backup/.env
                  echo '.env file backed up'
                else
                  echo 'No .env file found to backup'
                fi
              "

        - name: Stop running containers
          shell: bash
          run: |
              echo "Stopping running containers..."
              ssh remote "sudo /usr/local/bin/stop_backtrade.sh safe_app"

        - name: Complete directory cleanup
          shell: bash
          run: |
              echo "Completely cleaning deployment directory..."
              ssh remote "
                cd '${{ inputs.remote_dir }}' && \
                rm -rf ./* ./.[!.]* ./.??* 2>/dev/null || true && \
                echo 'Directory cleaned'
              "

        - name: Copy files to remote
          shell: bash
          run: |
              echo "Copying repository files to remote..."
              # Create a clean tarball excluding development files and directories
              tar --exclude='.git' \
                  --exclude='.github' \
                  --exclude='node_modules' \
                  --exclude='**/node_modules' \
                  --exclude='dist' \
                  --exclude='**/dist' \
                  --exclude='coverage' \
                  --exclude='**/coverage' \
                  --exclude='.env' \
                  --exclude='*.log' \
                  --exclude='.vscode' \
                  --exclude='.idea' \
                  --exclude='*.swp' \
                  --exclude='*.swo' \
                  --exclude='.DS_Store' \
                  --exclude='Thumbs.db' \
                  -czf - . | ssh remote "cd '${{ inputs.remote_dir }}' && tar -xzf -"
              echo "Files copied successfully"

        - name: Restore .env file
          shell: bash
          run: |
              echo "Restoring .env file..."
              ssh remote "
                if [ -f /tmp/backtrade_deploy_backup/.env ]; then
                  cp /tmp/backtrade_deploy_backup/.env '${{ inputs.remote_dir }}/.env'
                  echo '.env file restored'
                else
                  echo 'No .env backup found to restore'
                fi
                rm -rf /tmp/backtrade_deploy_backup
              "

        - name: Deploy application
          shell: bash
          run: |
              echo "Deploying application..."
              ssh remote "export DATABASE_URL='${{ inputs.database_url }}' && sudo -E /usr/local/bin/refresh_backtrade.sh safe_app"
