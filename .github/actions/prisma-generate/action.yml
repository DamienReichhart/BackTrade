name: Prisma Generate
description: Generate Prisma Client for the datas package
inputs:
    database-url:
        description: Database URL for Prisma configuration
        required: true
runs:
    using: composite
    steps:
        - name: Generate Prisma Client
          shell: bash
          working-directory: packages/datas
          env:
              DATABASE_URL: ${{ inputs.database-url }}
          run: pnpm prisma:generate
